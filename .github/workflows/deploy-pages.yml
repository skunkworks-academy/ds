name: Deploy Desh IDR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/configure-pages@v5

      - run: npm install --no-audit --no-fund

      - name: Validate source and release controls
        run: npm run validate

      - name: Build Docusaurus
        run: npm run build

      - name: Verify deployable output and clean routes
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/CNAME
          grep -Fxq 'ds.skunkworksacademy.com' build/CNAME
          test -s build/404.html
          test -s build/route-recovery.js
          grep -Fq '/route-recovery.js' build/404.html
          grep -Fq '/idr/12-week-sprint' build/route-recovery.js
          grep -Fq '/idr/calendar' build/route-recovery.js
          grep -Fq '/idr/download-and-review' build/route-recovery.js
          test -s build/downloads/desh-idr-12-week-calendar.ics
          test -s build/downloads/Deshan_Singh_Individual_Development_Roadmap.pdf
          test "$(stat -c%s build/downloads/Deshan_Singh_Individual_Development_Roadmap.pdf)" -gt 30000
          head -c 5 build/downloads/Deshan_Singh_Individual_Development_Roadmap.pdf | grep -q '%PDF-'

          required_routes=(
            overview complete-idr profile pathway roadmap 12-week-sprint credentials curriculum
            labs assignments projects calendar kpis mentor governance resources references download-and-review
          )
          for route in "${required_routes[@]}"; do
            test -s "build/idr/${route}/index.html"
          done

          grep -Fq 'academy-navigation.js' build/index.html
          grep -Fq 'favicon-black.png' build/index.html
          grep -Fq '/route-recovery.js' build/index.html
          grep -Fq 'Deshan_Singh_Individual_Development_Roadmap.pdf' build/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
